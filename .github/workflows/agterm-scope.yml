name: Agterm Sancta scope

on:
  pull_request:
    paths:
      - '.github/workflows/agterm-scope.yml'
      - 'tests/agterm-sancta-scope.nix'
      - 'tests/check_sancta_guard_wrapper.py'
      - 'tests/sancta-guard-wrapper.nix'
      - 'tests/fixtures/sancta-guard-protocol.py'
      - 'modules/services/claude-code-managed-settings.nix'
      - 'hosts/sancta-choir/configuration.nix'
      - 'modules/services/sancta-session-scope.nix'
      - 'flake.nix'
      - 'flake.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Enable KVM for disposable Nix builders
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test big-parallel kvm
      - name: Verify backend scope policy and managed guard wrapper
        run: nix build .#checks.x86_64-linux.agterm-sancta-scope .#checks.x86_64-linux.sancta-guard-wrapper --no-link --max-jobs 1 --cores 2
