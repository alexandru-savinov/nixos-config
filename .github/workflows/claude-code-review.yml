name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@e90deca47693f9457b72f2b53c17d7c445a87342 # v1.0.171
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are a code reviewer. Review this pull request thoroughly.

            ## Step 1: Read the PR diff
            Run: gh pr diff ${{ github.event.pull_request.number }}

            ## Step 2: Analyze for issues
            Evaluate the changes for:
            - **CRITICAL**: Security vulnerabilities, secret exposure, data loss risks,
              configurations that could break production or expose services
            - **HIGH**: Bugs that will cause runtime failures, broken NixOS builds,
              misconfigured services
            - **MEDIUM**: Code quality issues, missing error handling, performance concerns
            - **LOW**: Style issues, minor improvements, documentation gaps

            Focus on what's relevant for a NixOS infrastructure repo: service configs,
            firewall rules, secrets handling, systemd units, package integrity.

            Use the repository's CLAUDE.md for guidance on style and conventions.

            ## Step 3: Write your findings to review-findings.json

            Write EVERY finding of severity MEDIUM or above to a file named
            `review-findings.json` in the repository root, using the Write tool.
            A later workflow step — plain bash, no model — turns each entry into
            its own resolvable review thread. You do NOT post them yourself.

            The file must be a JSON array. Write `[]` if you found nothing at
            MEDIUM or above. Writing it is MANDATORY: a missing file fails the
            job, because a review that posted nothing must never be mistaken for
            a review that found nothing.

            Each element:

            {
              "path": "path/to/file",        // repository-relative, exactly as in the diff
              "line": 123,                   // the line the finding is anchored to
              "side": "RIGHT",               // "RIGHT" for added/unchanged lines,
                                             // "LEFT" for lines the diff DELETES —
                                             // GitHub rejects RIGHT on a deleted line
              "body": "**SEVERITY** — the finding, why it is wrong, and the concrete fix"
            }

            One finding, one element. Do NOT bundle several findings into one
            entry: each has to be resolvable on its own, because whoever
            disposes of it is answering for that finding alone. Start `body`
            with the severity in bold, and keep its FIRST LINE stable for the
            same finding across runs — the poster step deduplicates on
            path + line + first line of body, so an unchanged finding does not
            reappear as a second thread every time the branch is pushed.

            Why threads and not one comment: with
            `required_conversation_resolution` enabled on the branch, GitHub
            blocks the merge until every thread is explicitly resolved by a
            human with write access. That makes the gate a human act with a
            name on it, rather than a model's verdict — the disposition is
            attributable, and a finding the reviewer got wrong is answered by
            resolving the thread with a reason instead of by editing code to
            satisfy the model or by weakening the gate.

            LOW findings and anything you consider merely advisory: put them in
            ONE summary comment via `gh pr comment`, not in this file. A thread
            is a thing someone must act on; do not manufacture work.

            ## Step 4: Write verdict (REQUIRED — do this LAST, as a SEPARATE tool call)
            After posting your findings, you MUST execute one of these commands
            as a separate Bash tool call:

            If you found any CRITICAL or HIGH severity issues:
            echo CRITICAL > review-verdict

            If no critical/high issues found:
            echo PASS > review-verdict

            THIS IS MANDATORY. The CI check will fail if you do not write the verdict.
            Do NOT skip this step. Do NOT combine it with the comment step.

            NOTE ON WHAT THIS VERDICT IS: it is SELF-REPORTED by you, not derived
            from your review text — there is no schema and no second opinion. It
            is therefore deliberately kept at CRITICAL/HIGH only. The MEDIUM gate
            lives in the review threads above, where a human resolves each one,
            not in this file.

          # NOTE: `gh api` is deliberately NOT granted. This job's prompt is fed
          # the PR diff, which is attacker-influenced content, and the job holds
          # `pull-requests: write` — an unrestricted `gh api` would let an
          # injected instruction submit an APPROVING review on the very PR under
          # review, i.e. rebuild the zero-human merge lane by another door. The
          # agent therefore writes findings to a file and a deterministic step
          # below posts them; the worst an injection can now do is put wrong text
          # in a review comment, which it could already do via `gh pr comment`.
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(echo:*),Bash(printf:*),Write"'

      # Deterministic poster: reads the reviewer's findings file and opens one
      # resolvable thread per finding. Runs before the verdict gate so findings
      # still reach the PR when the verdict is CRITICAL.
      - name: Post findings as review threads
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ ! -f review-findings.json ]; then
            echo "::error::The reviewer did not write review-findings.json. Failing as a precaution — a review that posts nothing must not look like a review that found nothing."
            exit 1
          fi
          if ! jq -e 'type == "array"' review-findings.json > /dev/null 2>&1; then
            echo "::error::review-findings.json is not a JSON array."
            cat review-findings.json
            exit 1
          fi
          echo "reviewer reported $(jq 'length' review-findings.json) finding(s) at MEDIUM or above"

          # Threads already open on this PR. Without this, every push re-posts
          # every still-applicable finding as a fresh thread, and with
          # required_conversation_resolution that is unbounded human work.
          gh api --paginate "repos/$REPO/pulls/$PR/comments" \
            --jq '.[] | [(.path // ""), ((.line // .original_line) | tostring), ((.body // "") | split("\n")[0])] | @tsv' \
            > existing.tsv || true

          posted=0
          skipped=0
          failed=0
          while IFS= read -r finding; do
            path=$(jq -r '.path // ""' <<< "$finding")
            line=$(jq -r '.line // 0' <<< "$finding")
            side=$(jq -r 'if .side == "LEFT" then "LEFT" else "RIGHT" end' <<< "$finding")
            body=$(jq -r '.body // ""' <<< "$finding")

            if [ -z "$path" ] || [ "$line" = "0" ] || [ -z "$body" ]; then
              echo "::error::a finding is missing path, line, or body: $finding"
              failed=$((failed + 1))
              continue
            fi

            key=$(printf '%s\t%s\t%s' "$path" "$line" "$(head -n 1 <<< "$body")")
            if grep -Fqx -- "$key" existing.tsv; then
              echo "  already open: $path:$line"
              skipped=$((skipped + 1))
              continue
            fi

            if gh api "repos/$REPO/pulls/$PR/comments" \
                 -f body="$body" -f commit_id="$HEAD_SHA" \
                 -f path="$path" -F line="$line" -f side="$side" > /dev/null; then
              echo "  posted: $path:$line ($side)"
              posted=$((posted + 1))
            else
              echo "::warning::could not anchor $path:$line — falling back to a plain comment"
              if gh pr comment "$PR" --body "$body"$'\n\n'"_(could not be anchored to \`$path:$line\`)_" > /dev/null; then
                posted=$((posted + 1))
              else
                failed=$((failed + 1))
              fi
            fi
          done < <(jq -c '.[]' review-findings.json)

          echo "posted=$posted already-open=$skipped failed=$failed"
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed finding(s) never reached the PR. A finding that is not posted is a finding that silently does not gate."
            exit 1
          fi

      - name: Check review verdict
        if: always()
        run: |
          verdict=$(cat review-verdict 2>/dev/null || echo "UNKNOWN")
          echo "Claude review verdict: $verdict"
          if [ "$verdict" = "CRITICAL" ]; then
            echo "::error::Claude Code Review found CRITICAL or HIGH severity issues."
            echo "Check the review comment on the PR for details."
            exit 1
          elif [ "$verdict" = "UNKNOWN" ]; then
            echo "::error::Claude did not produce a review verdict. Failing as a precaution."
            exit 1
          fi
