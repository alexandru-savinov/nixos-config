name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

# One run per PR. Two overlapping runs would both list the already-open threads
# before either had posted, both conclude a finding is absent, and both post it —
# duplicate threads for one finding, each of which a human must resolve
# separately. The dedup below is only correct if it is not racing itself.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@e90deca47693f9457b72f2b53c17d7c445a87342 # v1.0.171
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are a code reviewer. Review this pull request thoroughly.

            ## Step 1: Read the PR diff
            Run: gh pr diff ${{ github.event.pull_request.number }}

            ## Step 2: Analyze for issues
            Evaluate the changes for:
            - **CRITICAL**: Security vulnerabilities, secret exposure, data loss risks,
              configurations that could break production or expose services
            - **HIGH**: Bugs that will cause runtime failures, broken NixOS builds,
              misconfigured services
            - **MEDIUM**: Code quality issues, missing error handling, performance concerns
            - **LOW**: Style issues, minor improvements, documentation gaps

            Focus on what's relevant for a NixOS infrastructure repo: service configs,
            firewall rules, secrets handling, systemd units, package integrity.

            Use the repository's CLAUDE.md for guidance on style and conventions.

            ## Step 3: Write your findings to review-findings.json

            Write EVERY finding, of ANY severity including LOW, to a file named
            `review-findings.json` in the repository root, using the Write tool.
            A later workflow step — plain bash, no model — turns each entry into
            either its own resolvable review thread (CRITICAL/HIGH/MEDIUM) or a
            bundled advisory summary comment (LOW). You do NOT post anything
            yourself: you have no PR-commenting tool at all, by design (see the
            note above `claude_args` below).

            The file must be a JSON array. Write `[]` if you found nothing.
            Writing it is MANDATORY: a missing file fails the job, because a
            review that posted nothing must never be mistaken for a review that
            found nothing.

            Each element:

            {
              "severity": "CRITICAL",        // one of CRITICAL | HIGH | MEDIUM | LOW —
                                             // the gate is DERIVED from this field, so
                                             // it must be EXACT, one of those four
                                             // spellings and nothing else. CRITICAL,
                                             // HIGH and MEDIUM each become a resolvable
                                             // thread AND fail this check; LOW is bundled
                                             // into one advisory comment and blocks
                                             // nothing. Anything that is not exactly LOW
                                             // is treated as blocking, so a misspelt
                                             // severity fails the check rather than
                                             // slipping through as advisory.
              "path": "path/to/file",        // repository-relative, exactly as in the diff
              "line": 123,                   // the line the finding is anchored to
              "side": "RIGHT",               // "RIGHT" for added/unchanged lines,
                                             // "LEFT" for lines the diff DELETES —
                                             // GitHub rejects RIGHT on a deleted line
              "body": "**SEVERITY** — the finding, why it is wrong, and the concrete fix"
            }

            One finding, one element, at EVERY severity — including LOW. Do NOT
            bundle several findings into one entry yourself; the poster step
            does the bundling for LOW. Each entry has to be resolvable (or, for
            LOW, readable) on its own, because whoever disposes of it is
            answering for that finding alone. Start `body` with the severity in
            bold, and keep its FIRST LINE stable for the same finding across
            runs — the poster step deduplicates on path + line + first line of
            body, so an unchanged finding does not reappear as a second thread
            every time the branch is pushed.

            Why threads and not one comment for CRITICAL/HIGH/MEDIUM: with
            `required_conversation_resolution` enabled on the branch, GitHub
            blocks the merge until every thread is explicitly resolved by a
            human with write access. The thread is what makes the disposition
            attributable — a finding the reviewer got wrong is answered by
            resolving the thread with a reason, not by editing code to satisfy
            the model.

            Note what the failing check adds on top of that, because it is a
            real shift and not a formality: the thread makes a finding
            answerable, but a human can also simply never look. The check makes
            the finding unignorable. Resolving the thread does NOT turn the
            check green — the next run re-reads the diff, and while the code
            still warrants the finding the reviewer will report it again. So a
            MEDIUM now clears in one of exactly two honest ways: the code
            changes, or a human with write access overrides the check
            deliberately and leaves their name on that decision. Being talked
            out of a finding you still believe is not one of them.

            LOW findings and anything you consider merely advisory: still write
            them as entries in review-findings.json with `"severity": "LOW"`.
            The poster step bundles all of them into ONE advisory comment
            instead of individual resolvable threads — a LOW finding is not a
            thing someone must act on, so it must not manufacture the same kind
            of mandatory work a CRITICAL/HIGH/MEDIUM thread does. You do not
            call `gh pr comment` yourself for these, or for anything else.

            ## The verdict is DERIVED — there is no separate step for it.
            A later plain-bash step reads `review-findings.json` and FAILS THE
            CHECK if any entry's `severity` is anything other than LOW — so
            MEDIUM, HIGH and CRITICAL all turn this check red. So there is no
            `review-verdict` file to write and no separate tool call to remember:
            the `severity` field on each finding IS the verdict. This is
            deliberate — the old self-reported `echo PASS > review-verdict` step
            failed the check as UNKNOWN whenever that one separate tool call was
            skipped or the runtime aborted before it, turning clean PRs red. A
            gate derived from the mandatory, validated findings file cannot fail
            that way. Get each finding's `severity` right; that is the whole gate.

            Weigh MEDIUM accordingly: it now stops the merge in the pipeline,
            not only through a thread a human must resolve. That cuts both
            ways, and BOTH directions are real damage. Do not inflate a genuine
            style nit to MEDIUM to make it noticeable — it will block a change
            that is fine. Do not deflate a real correctness or safety problem to
            LOW to keep the check green — LOW blocks nothing, so that hides it
            completely, and the whole point of this gate is that findings stop
            depending on a human happening to read them. Rate the finding on the
            harm it describes, exactly as the severity list above defines it,
            and ignore what colour the check will end up.

          # NOTE: `gh api` is deliberately NOT granted. This job's prompt is fed
          # the PR diff, which is attacker-influenced content, and the job holds
          # `pull-requests: write` — an unrestricted `gh api` would let an
          # injected instruction submit an APPROVING review on the very PR under
          # review, i.e. rebuild the zero-human merge lane by another door. The
          # agent therefore writes findings to a file and a deterministic step
          # below posts them.
          #
          # NOR is `gh pr comment` (or any other raw PR-comment channel)
          # granted, for the same reason at one more remove. It used to be, so
          # the model could post a LOW-findings advisory summary directly — but
          # the finding body is attacker-influenced (it is written by a model
          # that just read the PR diff), and claude.yml fires on any comment
          # containing `@claude`, running an agent with no tool restriction at
          # all. A raw, ungated comment channel is therefore a live escalation
          # path: an injected diff can shape a LOW finding's WORDS into a
          # working `@claude <instructions>` mention, and that channel had no
          # defusal on it at all, unlike the findings-file path below. Removing
          # the grant closes it BY CONSTRUCTION rather than by trusting the
          # prompt text alone to keep the model in-lane: the agent now has no
          # tool that can put text in front of a human (or another workflow)
          # except by writing review-findings.json, and every entry in that
          # file — LOW included — passes through the same deterministic
          # neutralisation below before it becomes a real comment. claude.yml's
          # Bot-author gate (PR #555, merged) is the other lock; this is the
          # one that does not depend on the model choosing to use it correctly.
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(echo:*),Bash(printf:*),Write"'

      # Deterministic poster: reads the reviewer's findings file and opens one
      # resolvable thread per finding (CRITICAL/HIGH/MEDIUM), or bundles all
      # LOW findings into one advisory comment. Runs before the verdict gate so
      # findings still reach the PR when the verdict is CRITICAL.
      - name: Post findings as review threads
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ ! -f review-findings.json ]; then
            echo "::error::The reviewer did not write review-findings.json. Failing as a precaution — a review that posts nothing must not look like a review that found nothing."
            exit 1
          fi
          if ! jq -e 'type == "array"' review-findings.json > /dev/null 2>&1; then
            echo "::error::review-findings.json is not a JSON array."
            cat review-findings.json
            exit 1
          fi
          echo "reviewer reported $(jq 'length' review-findings.json) finding(s) total"

          # Threads already open on this PR. Without this, every push re-posts
          # every still-applicable finding as a fresh thread, and with
          # required_conversation_resolution that is unbounded human work.
          #
          # NO `|| true` HERE. A rate limit or a 5xx would leave this file empty,
          # every already-posted finding would look absent, and the step would
          # re-post all of them — the exact unbounded duplication the dedup
          # exists to prevent, arrived at by the dedup failing quietly. An empty
          # list from a PR with no comments is a successful call and exits 0;
          # only a real error stops the job, which is the intended difference.
          gh api --paginate "repos/$REPO/pulls/$PR/comments" \
            --jq '.[] | [(.path // ""), ((.line // .original_line) | tostring), ((.body // "") | split("\n")[0])] | @tsv' \
            > existing.tsv

          # Plain comments already posted. These are a SEPARATE store: an
          # unanchorable finding lands here, and it never appears in the review
          # comments listed above, so without this it would be re-posted on
          # every push forever.
          gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | (.body // "") | split("\n")[0]' \
            > existing-plain.tsv

          posted=0
          skipped=0
          failed=0
          unanchored=0
          low=0
          : > low-findings.txt
          while IFS= read -r finding; do
            severity=$(jq -r '.severity // ""' <<< "$finding")
            path=$(jq -r '.path // ""' <<< "$finding")
            line=$(jq -r '.line // 0' <<< "$finding")
            side=$(jq -r 'if .side == "LEFT" then "LEFT" else "RIGHT" end' <<< "$finding")
            body=$(jq -r '.body // ""' <<< "$finding")

            # Defuse bot mentions. This body was written by a model that read the
            # PR diff, and it is about to become a real review comment — which is
            # a TRIGGER, not just text: claude.yml fires on `@claude` anywhere in
            # a comment. Breaking the literal substring costs nothing and the
            # finding stays perfectly readable. claude.yml's Bot-author gate
            # (PR #555, merged) is the other lock. Applied to EVERY severity,
            # including LOW — the LOW-bundle branch below relies on this having
            # already run, since it is the only defusal that bundle ever gets.
            # Case-insensitive on purpose: GitHub's `contains()` is, so `@CLAUDE`
            # triggers just as well as `@claude`.
            body="${body//@[Cc][Ll][Aa][Uu][Dd][Ee]/@ claude}"

            if [ -z "$path" ] || [ "$line" = "0" ] || [ -z "$body" ]; then
              echo "::error::a finding is missing path, line, or body: $finding"
              failed=$((failed + 1))
              continue
            fi

            # LOW findings never become a resolvable thread — required_conversation_
            # resolution must not gate merge on style nits. They are collected here
            # and posted as ONE bundled advisory comment after the loop, by this same
            # deterministic step — never by the model, which holds no PR-comment tool
            # at all (see the note above claude_args). $body is already defused above.
            if [ "$(printf '%s' "$severity" | tr '[:lower:]' '[:upper:]')" = "LOW" ]; then
              {
                printf -- '- **%s:%s**\n' "$path" "$line"
                printf '%s\n\n' "$body"
              } >> low-findings.txt
              low=$((low + 1))
              continue
            fi

            key=$(printf '%s\t%s\t%s' "$path" "$line" "$(head -n 1 <<< "$body")")
            if grep -Fqx -- "$key" existing.tsv; then
              echo "  already open: $path:$line"
              skipped=$((skipped + 1))
              continue
            fi

            if apierr=$(gh api "repos/$REPO/pulls/$PR/comments" \
                 -f body="$body" -f commit_id="$HEAD_SHA" \
                 -f path="$path" -F line="$line" -f side="$side" 2>&1 > /dev/null); then
              echo "  posted: $path:$line ($side)"
              posted=$((posted + 1))
            elif ! grep -q '422' <<< "$apierr"; then
              # NOT an anchor rejection. A rate limit, a 5xx or a network blip
              # says nothing about whether the line is in the diff, and the
              # fallback below would publish a comment asserting "could not be
              # anchored" — a claim that is simply false, and that the dedup
              # then preserves across retries. Same distinction the listing
              # calls above are careful to make; it belongs here too.
              echo "::error::posting $path:$line failed for a reason unrelated to anchoring: $apierr"
              failed=$((failed + 1))
              continue
            else
              # The anchor failed — the line is not in the current diff. A plain
              # comment is NOT an equivalent fallback: it has no "Resolve
              # conversation" button, so `required_conversation_resolution` does
              # not gate on it at all. Posting one and calling the finding
              # delivered would route the finding around the very gate this step
              # exists to build, and it is exactly the findings about REMOVED
              # code that land here. So: still post it, so the text is visible —
              # then fail the job, so a human learns this one is not gating
              # rather than discovering it at merge time.
              plainkey=$(head -n 1 <<< "$body")
              if grep -Fqx -- "$plainkey" existing-plain.tsv; then
                echo "  already posted (unanchored): $path:$line"
              elif gh pr comment "$PR" --body "$body"$'\n\n'"_(could not be anchored to \`$path:$line\` — this comment is NOT a resolvable thread and does NOT block the merge)_" > /dev/null; then
                echo "  posted unanchored: $path:$line"
              else
                echo "::error::could not post $path:$line at all, by either route"
                failed=$((failed + 1))
                continue
              fi
              unanchored=$((unanchored + 1))
            fi
          done < <(jq -c '.[]' review-findings.json)

          # Post the bundled LOW/advisory comment, if there is one. ONE comment,
          # not one thread per finding — see the note in the loop above for why.
          #
          # Dedup granularity here is coarser than the per-finding dedup above:
          # the header line carries the count, so an unchanged set of LOW
          # findings is not re-posted on an unrelated push, but a same-COUNT
          # different-CONTENT set would be skipped too. That is an accepted,
          # deliberate tradeoff for advisory-only content with no correctness
          # stakes — the alternative (editing a prior comment via the REST API,
          # or hashing full content) is real complexity this severity does not
          # warrant. Nothing here participates in required_conversation_resolution
          # either way.
          if [ "$low" -gt 0 ]; then
            low_header=$(printf '**LOW / advisory findings from this review (%s found):**' "$low")
            if grep -Fqx -- "$low_header" existing-plain.tsv; then
              echo "  LOW bundle already posted for this count ($low): skipped"
            elif gh pr comment "$PR" --body "$low_header"$'\n\n'"$(cat low-findings.txt)" > /dev/null; then
              echo "  posted LOW bundle: $low finding(s)"
            else
              echo "::error::could not post the bundled LOW/advisory comment"
              failed=$((failed + 1))
            fi
          fi

          echo "posted=$posted already-open=$skipped unanchored=$unanchored low=$low failed=$failed"
          if [ "$unanchored" -gt 0 ]; then
            echo "::error::$unanchored finding(s) could not be anchored to a line in this diff. They were posted as plain comments, which do NOT participate in required_conversation_resolution — so they do not block the merge. Re-anchor them or dispose of them deliberately; do not let them pass as gated."
            failed=$((failed + unanchored))
          fi
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed finding(s) never reached the PR, or reached it without gating. A finding that does not gate is a finding that silently does not gate."
            exit 1
          fi

      - name: Check review verdict
        if: always()
        run: |
          # Derive the verdict from review-findings.json — the file the review
          # step is already REQUIRED to write and that the earlier "validate"
          # step already proved exists and is a JSON array. Depending on that
          # file instead of a second, self-reported `review-verdict` file
          # removes the failure mode where a clean review went red as UNKNOWN
          # because the separate `echo PASS > review-verdict` tool call was
          # skipped or the runtime aborted before it.
          if [ ! -f review-findings.json ] || ! jq -e 'type == "array"' review-findings.json > /dev/null 2>&1; then
            echo "::error::review-findings.json missing or not a JSON array — cannot derive a verdict. Failing as a precaution."
            exit 1
          fi
          # Blocking = every finding that is NOT LOW — so MEDIUM blocks too.
          #
          # This is stated as "not LOW" rather than as the list
          # CRITICAL/HIGH/MEDIUM on purpose, and the difference is the whole
          # point. The poster step above routes on exactly one distinction:
          # LOW gets bundled into an advisory comment, everything else becomes
          # a resolvable thread. Writing the verdict with the SAME predicate
          # makes "the poster opened a gating thread for it" and "the check is
          # red" the same condition by construction. Enumerating severities
          # here instead would let the two drift apart the moment the reviewer
          # writes a severity nobody listed — `MED`, `Moderate`, or an empty
          # string — which would open a thread and still report PASS. That
          # silent-pass shape is precisely what this step exists to remove, so
          # an unrecognised severity fails closed and is named in the output.
          #
          # Matching is `ascii_upcase` with no trimming, mirroring the poster's
          # `tr '[:lower:]' '[:upper:]'` exactly. Any normalisation applied on
          # one side and not the other reintroduces the drift described above.
          blocking=$(jq '[.[] | select((.severity // "" | ascii_upcase) != "LOW")] | length' review-findings.json)
          echo "blocking (non-LOW) findings: $blocking"
          if [ "$blocking" -gt 0 ]; then
            echo "::error::Claude Code Review found $blocking blocking finding(s) above LOW. See the resolvable review threads on the PR."
            jq -r '.[] | select((.severity // "" | ascii_upcase) != "LOW") | "  - [\(.severity // "<no severity>")] \(.path):\(.line)"' review-findings.json
            exit 1
          fi
          echo "verdict: PASS — no findings above LOW"
