name: Flake Update

on:
  schedule:
    # Nightly at 02:00 UTC — nixpkgs only (security patches), via PR
    - cron: "0 2 * * *"
    # Weekly on Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      update_all:
        description: "Update all inputs (true) or only nixpkgs (false)"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: write
  pull-requests: write
  # Needed to dispatch check.yml on the PR branch (see the last step).
  actions: write

jobs:
  update-flake:
    name: Update Flake Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-platforms = aarch64-linux

      - name: Setup Cachix
        uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
        with:
          name: nix-community

      - name: Set up QEMU for aarch64 emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Get current flake.lock hash
        id: before
        run: echo "hash=$(sha256sum flake.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Determine update scope
        id: scope
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          UPDATE_ALL: ${{ inputs.update_all }}
        run: |
          if [ "$EVENT_SCHEDULE" = "0 2 * * *" ]; then
            echo "mode=nightly" >> "$GITHUB_OUTPUT"
          else
            if [ "$UPDATE_ALL" = "false" ]; then
              echo "mode=nixpkgs-only" >> "$GITHUB_OUTPUT"
            else
              echo "mode=full" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Update flake inputs
        env:
          MODE: ${{ steps.scope.outputs.mode }}
        run: |
          if [ "$MODE" = "nightly" ] || [ "$MODE" = "nixpkgs-only" ]; then
            echo "Updating nixpkgs inputs only..."
            nix flake update nixpkgs nixpkgs-unstable
          else
            echo "Updating all flake inputs..."
            nix flake update
          fi

      - name: Get updated flake.lock hash
        id: after
        run: echo "hash=$(sha256sum flake.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: changes
        run: |
          if [ "${{ steps.before.outputs.hash }}" != "${{ steps.after.outputs.hash }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify configurations still evaluate
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "Checking flake validity..."
          nix flake check --all-systems

          echo "Evaluating configurations..."
          nix eval .#nixosConfigurations.sancta-choir.config.system.build.toplevel.drvPath
          nix eval .#nixosConfigurations.rpi5-full.config.system.build.toplevel.drvPath

      # Raspberry Pi cache-miss check. FLAGS, never fails, when the updated
      # lock would make the Pi build its kernel/firmware from source because
      # the vendor cache (nixos-raspberrypi.cachix.org) does not hold them.
      # Dry-run only: nothing is built or downloaded. Runs in every mode: a
      # nixpkgs-only bump does not change the Pi kernel hash (#182), but the
      # vendor cache can evict the pinned kernel at any time, and every mode
      # now opens a PR where the flag is visible.
      - name: Pi cache-miss check (kernel/firmware substitutable?)
        if: steps.changes.outputs.changed == 'true'
        id: picache
        continue-on-error: true
        run: |
          set +e
          md="$RUNNER_TEMP/pi-cache.md"
          bash scripts/pi-cache-miss.sh --markdown "$md" --github-output "$GITHUB_OUTPUT" rpi5 rpi5-full
          rc=$?
          if [ ! -s "$md" ]; then
            printf '### Raspberry Pi cache check\n\n⚠ **Pi cache check did not run** (exit %s). See the workflow log. Absence of a flag here is NOT a green.\n' "$rc" > "$md"
          fi
          cat "$md" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # Every mode (nightly, weekly, manual) opens or updates a PR. Nothing in
      # this workflow pushes to main; main moves only by a merged PR. CI on
      # these PRs is started explicitly by the last step (GITHUB_TOKEN-created
      # PRs do not trigger it). Nightly and manual nixpkgs-only share one
      # branch, so a pending nixpkgs bump is updated in place, not stacked.
      - name: Generate update summary
        if: steps.changes.outputs.changed == 'true'
        id: summary
        run: |
          {
            echo 'summary<<EOF'
            echo "## Flake Input Updates"
            echo ""
            echo "### Changed Inputs"
            echo '```diff'
            git diff flake.lock | head -60
            echo '```'
            echo ""
            echo "### Verification Checklist"
            echo ""
            echo "- [ ] CI builds pass"
            echo "- [ ] No breaking changes in upstream changelogs"
            echo "- [ ] Test deployment if concerned"
            echo ""
            if [ -s "$RUNNER_TEMP/pi-cache.md" ]; then
              cat "$RUNNER_TEMP/pi-cache.md"
            else
              echo "### Raspberry Pi cache check"
              echo ""
              echo "⚠ **Pi cache check did not run**. See the workflow log."
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      # POST /repos/{owner}/{repo}/labels is allowed by "Pull requests: write"
      # (or "Issues: write") per GitHub's fine-grained permission table, so the
      # existing pull-requests: write is enough; no issues: write needed. A
      # failure is surfaced as a warning annotation, not masked: the label is
      # still attached by the Create Pull Request step (adding a missing label
      # to an issue creates it), only without this colour/description.
      - name: Ensure pi-cache-miss label exists
        if: steps.changes.outputs.changed == 'true' && steps.picache.outputs.miss == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh label create pi-cache-miss --force --repo "$GITHUB_REPOSITORY" \
            --color B60205 \
            --description "Flake update would build the Raspberry Pi kernel/firmware from source (vendor cache miss)"; then
            echo "::warning::could not create/update the pi-cache-miss label (see above); the PR still gets the label, without colour/description"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "${{ steps.scope.outputs.mode == 'full' && 'chore(deps): update flake inputs' || 'chore(deps): update nixpkgs inputs' }}"
          title: "${{ steps.scope.outputs.mode == 'full' && 'chore(deps): Update Nix flake inputs' || 'chore(deps): Update nixpkgs inputs' }}"
          body: |
            ${{ steps.summary.outputs.summary }}

            ---
            *Automatically created by flake-update workflow*
          branch: ${{ steps.scope.outputs.mode == 'full' && 'chore/update-flake-lock-weekly' || 'chore/update-flake-lock' }}
          delete-branch: true
          labels: |
            dependencies
            automated
            ${{ steps.picache.outputs.miss == 'true' && 'pi-cache-miss' || '' }}

      # PR branches are reused: drop a stale flag once the miss is gone. Only on
      # a COMPLETE clean result: an incomplete check (failed=true) keeps a
      # previously confirmed miss visible.
      - name: Clear stale pi-cache-miss label
        if: steps.cpr.outputs.pull-request-number != '' && steps.picache.outputs.miss == 'false' && steps.picache.outputs.failed == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          if gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qx pi-cache-miss; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label pi-cache-miss
          fi

      # A PR created or updated with GITHUB_TOKEN does not trigger
      # pull_request workflows (GitHub blocks recursive runs), so check.yml
      # would never report on this PR by itself. workflow_dispatch is exempt
      # from that rule: dispatch check.yml on the PR branch so its required
      # checks run on the PR's head commit.
      - name: Run CI on the PR branch
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.scope.outputs.mode == 'full' && 'chore/update-flake-lock-weekly' || 'chore/update-flake-lock' }}
        run: gh workflow run check.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
