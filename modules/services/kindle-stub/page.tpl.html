<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%%DOCTITLE%%</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; }
  body { background: #000; color: #fff; font-family: Georgia, serif; }
  body.day { background: #fff; color: #000; }
  #bar { height: 52px; border-bottom: 2px solid #fff; font: bold 22px sans-serif; white-space: nowrap; }
  body.day #bar { border-bottom-color: #000; }
  #bar a { display: inline-block; height: 40px; line-height: 40px; min-width: 60px; margin: 5px 4px 0 4px;
           border: 2px solid #fff; text-align: center; color: #fff; text-decoration: none; }
  body.day #bar a { border-color: #000; color: #000; }
  #pg { display: inline-block; margin-left: 10px; font-weight: normal; }
  #vp { position: relative; overflow: hidden; }
  #col { position: absolute; top: 0; left: 0; line-height: 1.45; }
  #col h2 { font-size: 1.05em; margin: 0.4em 0 0.8em 0; text-align: center; }
  #col h3 { font-size: 0.8em; margin: 0.8em 0 0 0; text-align: center; font-weight: normal; }
  /* No paragraph margins: placeArt measures the page top exactly, and a bottom margin collapsing
     through its zero-height marker pushed every picture to the page after a blank one. */
  #col p { margin: 0; text-indent: 1.4em; }
  #col p.r { text-align: right; text-indent: 0; }
  #col p.c { text-align: center; text-indent: 0; }
  #col p.n { text-indent: 0; font-size: 0.8em; }
  #col .art { margin: 0; padding: 0; overflow: hidden; text-align: center; -webkit-column-break-inside: avoid; break-inside: avoid; }
  #col .artmk { margin: 0; padding: 0; height: 0; }
  #col .art img { max-width: 100%; max-height: 420px; display: block; margin: 8px auto 10px auto; }
  #col .art p { text-indent: 0; margin: 0 0 .5em 0; font-size: 22px; line-height: 1.35; }
  #col .art .cap { font-style: italic; }
  #col .art .src { font-size: 18px; }
  #col ul { list-style: none; margin: 0; padding: 0; }
  #col li { margin: 0 0 0.5em 0; }
  #col li.part { font-weight: bold; margin-top: 0.6em; }
  #col li a, #col p a { color: #fff; }
  body.day #col li a, body.day #col p a { color: #000; }
  #col li.cur a { font-weight: bold; }
  #col li .at { font-style: italic; white-space: nowrap; }
</style></head>
<body>
<div id="bar"><a href="/r/%%TOC%%" id="toc">&#8801;</a><a href="#" id="minus">A&minus;</a><a href="#" id="plus">A+</a><a href="#" id="mode">&#9728;</a><span id="pg"></span></div>
<div id="vp"><div id="col">
%%BODY%%
</div></div>
<script>
(function () {
  var ID = "%%ID%%", PREV = "%%PREV%%", NEXT = "%%NEXT%%", IS_CH = %%ISCH%%;
  // The server swaps the comment+null below for its saved {ch, f}: the copy that survives a wiped localStorage.
  var SRV = /*SRVPOS*/null;
  var d = document, de = d.documentElement, b = d.body, vp = d.getElementById("vp"), col = d.getElementById("col");
  var bar = d.getElementById("bar");
  var P = 22, W = 0, H = 0, page = 0, pages = 1, fs = 28, night = true;
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, String(v)); } catch (e) {} return null; }
  var s = ls("k_fs"); if (s) fs = parseInt(s, 10) || 28;
  if (ls("k_night") === "0") night = false;
  // Read the saved position before the first layout, which would otherwise overwrite it.
  var savedCh = ls("%%KEY%%_ch"), savedF = parseFloat(ls("%%KEY%%_frac") || ""), sent = "";
  function okF(f) { return typeof f === "number" && f >= 0 && f <= 1; }
  function hashF() { var m = /^#f=([01](\.[0-9]{1,4})?)$/.exec(location.hash || ""); return m ? parseFloat(m[1]) : NaN; }

  // Pictures: each .art block fills one whole page and must start at a page top. A zero-height .artmk
  // marker before it is measured (unlike the block, it cannot straddle two pages) and grows to fill the
  // rest of the page. If that would leave the page before the picture mostly empty, the picture floats to
  // a nearby paragraph end (as plates do in printed books): candidates are measured with zero-height
  // probes in one pass; drifting from the scene costs, appearing before it costs more.
  function nextEl(n) { n = n.nextSibling; while (n && n.nodeType !== 1) n = n.nextSibling; return n; }
  function prevEl(n) { n = n.previousSibling; while (n && n.nodeType !== 1) n = n.previousSibling; return n; }
  function isPara(n) { return n && n.tagName === "P"; }
  function placeArt() {
    if (!col.getElementsByClassName) return;
    var mk = col.getElementsByClassName("artmk"), i, j, ctop, list = [];
    for (i = 0; i < mk.length; i++) list.push(mk[i]);
    for (i = 0; i < list.length; i++) {
      var m = list[i], art = nextEl(m);
      if (!m.home) m.home = prevEl(m);
      col.insertBefore(m, nextEl(m.home)); col.insertBefore(art, nextEl(m));
      m.style.height = "0px"; art.style.height = H + "px"; art.style.display = "";
    }
    for (i = 0; i < list.length; i++) {
      var m = list[i], art = nextEl(m);
      ctop = col.getBoundingClientRect().top;
      var top = m.getBoundingClientRect().top - ctop;
      if (top > 1 && top < H && H - top > 0.25 * H) {
        art.style.display = "none";
        var cands = [], probes = [], e, k;
        e = m.home; for (k = 0; k < 4 && isPara(e); k++) { cands.push({ el: e, d: -k }); e = prevEl(e); }
        e = nextEl(m); if (e === art) e = nextEl(art);
        for (k = 1; k <= 4 && isPara(e); k++) { cands.push({ el: e, d: k }); e = nextEl(e); }
        for (j = 0; j < cands.length; j++) {
          var pr = document.createElement("div"); pr.style.height = "0px";
          col.insertBefore(pr, nextEl(cands[j].el)); probes.push(pr);
        }
        ctop = col.getBoundingClientRect().top;
        var best = null, bestCost = 1e9;
        for (j = 0; j < cands.length; j++) {
          var t = probes[j].getBoundingClientRect().top - ctop;
          var blank = (t > 1 && t < H) ? (H - t) : 0;
          var d = cands[j].d, cost = blank + (d < 0 ? -d * 0.15 * H : d * 0.06 * H);
          if (cost < bestCost) { bestCost = cost; best = cands[j]; }
        }
        for (j = 0; j < probes.length; j++) col.removeChild(probes[j]);
        if (best) { col.insertBefore(m, nextEl(best.el)); col.insertBefore(art, nextEl(m)); }
        art.style.display = "";
        ctop = col.getBoundingClientRect().top;
        top = m.getBoundingClientRect().top - ctop;
      }
      if (top > 1 && top < H) m.style.height = Math.ceil(H - top) + "px";
    }
    var arts = col.getElementsByClassName("art"), q, ps, capH, imgs;
    for (i = 0; i < arts.length; i++) {
      ps = arts[i].getElementsByTagName("p"); capH = 0;
      for (q = 0; q < ps.length; q++) capH += ps[q].offsetHeight + 11;
      imgs = arts[i].getElementsByTagName("img");
      for (q = 0; q < imgs.length; q++) imgs[q].style.maxHeight = Math.max(300, H - capH - 30) + "px";
    }
  }
  // Memory: the Kindle browser crashed when a chapter decoded all its pictures at once (both day and night
  // copies). Only pictures on the current or next page get an image (the original engraving in both modes:
  // inverted night copies looked bad on the device); the rest are
  // released to a 1x1 placeholder.
  var BLANK = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
  function loadPics() {
    if (!col.getElementsByClassName) return;
    var arts = col.getElementsByClassName("art"), i, img, pg, want, cl = col.getBoundingClientRect().left;
    for (i = 0; i < arts.length; i++) {
      img = arts[i].getElementsByTagName("img")[0];
      if (!img) continue;
      pg = Math.floor((arts[i].getBoundingClientRect().left - cl + 1) / W);
      want = (pg === page || pg === page + 1) ? img.getAttribute("data-d") : BLANK;
      if (img.getAttribute("src") !== want) img.setAttribute("src", want);
    }
  }

  function frac() { return pages > 1 ? page / (pages - 1) : 0; }
  function layout(keep) {
    var f = frac();
    W = de.clientWidth || b.clientWidth || 758;
    var full = de.clientHeight || b.clientHeight || 897;
    H = full - bar.offsetHeight - 6;
    vp.style.width = W + "px"; vp.style.height = H + "px";
    var cw = W - 2 * P;
    col.style.width = cw + "px"; col.style.height = H + "px"; col.style.padding = "0 " + P + "px";
    col.style.fontSize = fs + "px";
    col.style.webkitColumnWidth = cw + "px"; col.style.webkitColumnGap = (2 * P) + "px";
    col.style.columnWidth = cw + "px"; col.style.columnGap = (2 * P) + "px";
    placeArt();
    pages = Math.max(1, Math.ceil((col.scrollWidth - P) / W));
    if (keep) page = Math.round(f * (pages - 1));
    if (page > pages - 1) page = pages - 1;
    show(keep);
  }
  // save: remember the position locally and send the server copy (only when it changed).
  function show(save) {
    col.style.left = (-page * W) + "px";
    loadPics();
    d.getElementById("pg").innerHTML = "стр. " + (page + 1) + " / " + pages;
    if (IS_CH && save) {
      var f = frac().toFixed(4);
      ls("%%KEY%%_ch", ID); ls("%%KEY%%_frac", f);
      if (f !== sent) { sent = f; new Image().src = "/pos?ch=" + ID + "&f=" + f + "&n=" + new Date().getTime(); }
    }
  }
  function paint() { b.className = night ? "" : "day"; d.getElementById("mode").innerHTML = night ? "&#9728;" : "&#9790;"; if (W) loadPics(); }

  paint();
  layout(false);
  if (IS_CH) {
    var hf = hashF(), end = location.hash === "#end", at = 0;
    // "#end" and "#f=" are one-shot hints. Drop them from the URL at once, so a reload or a reopened
    // last URL cannot reapply them over the newer position the reader saves while paging.
    if (end || okF(hf)) {
      try {
        if (history.replaceState) history.replaceState(null, "", location.pathname);
        else location.replace(location.pathname + "#");
      } catch (e) {}
    }
    if (end) at = 1;
    else if (savedCh === ID && okF(savedF)) at = savedF;
    else if (okF(hf)) at = hf;
    else if (SRV && SRV.ch === ID && okF(SRV.f)) at = SRV.f;
    page = Math.round(at * (pages - 1));
    show(true);
  } else {
    var cur = savedCh, cf = savedF;
    if (!(cur && d.getElementById("c-" + cur)) && SRV) { cur = SRV.ch; cf = SRV.f; }
    var li = cur && d.getElementById("c-" + cur);
    if (li) {
      li.className += " cur";
      var at2 = d.createElement("span");
      at2.className = "at";
      at2.innerHTML = " &#9656; читаете" + (okF(cf) ? ", " + Math.round(cf * 100) + "%" : "");
      li.appendChild(at2);
    }
  }

  d.getElementById("minus").onclick = function () { fs = Math.max(16, fs - 2); ls("k_fs", fs); layout(true); return false; };
  d.getElementById("plus").onclick  = function () { fs = Math.min(48, fs + 2); ls("k_fs", fs); layout(true); return false; };
  d.getElementById("mode").onclick  = function () { night = !night; ls("k_night", night ? 1 : 0); paint(); return false; };
  vp.onclick = function (e) {
    e = e || window.event;
    var t = e.target || e.srcElement;
    if (t && t.tagName === "A") return true;
    if (e.clientX > W / 2) {
      if (page < pages - 1) { page++; show(true); } else if (NEXT) { location.href = "/r/" + NEXT; }
    } else {
      if (page > 0) { page--; show(true); } else if (PREV) { location.href = "/r/" + PREV + "#end"; }
    }
    return false;
  };
})();
</script>
</body></html>
